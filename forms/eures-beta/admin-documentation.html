<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EURES beta - Documentation projet</title>
  <link rel="stylesheet" href="/forms/eures-beta/site.css">
  <style>
    body{font-family:Marianne,Arial,sans-serif;font-weight:400}.docs-shell{width:min(1440px,calc(100% - 2rem));margin:0 auto;padding:1rem 0 2rem}.docs-card{border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);border-radius:24px;padding:1.2rem}.docs-head{display:grid;gap:1rem;margin-bottom:1rem}.docs-head-top,.docs-actions,.docs-tabs{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center;justify-content:space-between}.docs-head h1{margin:0;color:var(--accent-strong);font-size:clamp(2rem,4vw,3rem);line-height:1;font-weight:700}.docs-head p{margin:.5rem 0 0;color:var(--muted);max-width:75ch;line-height:1.55}.docs-branding{width:clamp(160px,18vw,260px);height:auto}.docs-tabs{justify-content:flex-start}.docs-tabs a,.docs-actions button,.editor-actions button{min-height:44px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.9);color:var(--text);padding:.7rem 1rem;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}.docs-tabs a.active,.docs-actions button.primary,.editor-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.docs-layout{display:grid;grid-template-columns:minmax(280px,.72fr) minmax(0,1.7fr);gap:1rem}.docs-sidebar{display:grid;gap:1rem;align-content:start}.docs-filter{display:grid;gap:.45rem;font-weight:500}.docs-filter input,.docs-filter select,.doc-form input,.doc-form select,.doc-form textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);padding:.75rem .9rem;font:inherit;font-weight:400}.doc-list{display:grid;gap:.65rem;max-height:70vh;overflow:auto;padding-right:.25rem}.doc-list button{display:grid;gap:.32rem;text-align:left;width:100%;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.78);padding:.85rem;cursor:pointer;color:var(--text);font-weight:400}.doc-list button.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,84,166,.12)}.doc-list strong{font-size:.98rem;font-weight:600}.doc-meta,.status-line{font-size:.82rem;color:var(--muted)}.doc-editor{display:grid;gap:1rem}.doc-editor> .docs-head-top strong{font-weight:600}.doc-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}.doc-form label{display:grid;gap:.35rem;font-size:.88rem;font-weight:500}.doc-form .full{grid-column:1/-1}.doc-form textarea{resize:vertical}.doc-form #doc-summary{min-height:78px}.editor-actions{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center}.markdown-tools{display:flex;flex-wrap:wrap;gap:.35rem;padding:.55rem;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;background:#f5f8fb}.markdown-tools button,.markdown-tools select{min-height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);padding:.45rem .65rem;font:inherit;font-weight:500;cursor:pointer}.markdown-tools button:hover{border-color:var(--accent);color:var(--accent-strong)}.visual-editor{min-height:360px;border:1px solid var(--line);border-radius:0 0 14px 14px;background:#fff;padding:1rem;font:400 1rem/1.65 Marianne,Arial,sans-serif;outline:none;overflow-wrap:anywhere}.visual-editor:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,84,166,.12)}.visual-editor:empty:before{content:attr(data-placeholder);color:var(--muted)}.visual-editor h1,.visual-editor h2,.visual-editor h3{color:var(--accent-strong);line-height:1.2}.visual-editor blockquote{margin-left:0;padding-left:1rem;border-left:4px solid var(--accent);color:var(--muted)}.visual-editor pre{padding:1rem;border-radius:12px;background:#102a43;color:#f5f7fa;white-space:pre-wrap}.visual-editor table{width:100%;border-collapse:collapse}.visual-editor th,.visual-editor td{border:1px solid var(--line);padding:.5rem}.markdown-help{margin:0;font-size:.8rem;font-weight:400;color:var(--muted)}.preview{border:1px solid var(--line);border-radius:18px;background:#fff;padding:1.25rem;min-height:240px;line-height:1.7;overflow-wrap:anywhere}.preview h1,.preview h2,.preview h3{color:var(--accent-strong);line-height:1.2}.preview pre{overflow:auto;padding:1rem;border-radius:12px;background:#102a43;color:#f5f7fa}.preview code{padding:.15rem .35rem;border-radius:5px;background:#eef3f7}.preview pre code{padding:0;background:transparent}.preview blockquote{margin-left:0;padding-left:1rem;border-left:4px solid var(--accent);color:var(--muted)}.preview table{width:100%;border-collapse:collapse}.preview th,.preview td{border:1px solid var(--line);padding:.5rem;text-align:left}.history{display:grid;gap:.55rem}.history article{border-left:3px solid var(--line);padding-left:.75rem}.history p{margin:.15rem 0;color:var(--muted);font-size:.86rem}.empty{padding:1rem;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.hidden{display:none!important}@media(max-width:900px){.docs-layout{grid-template-columns:1fr}.doc-list{max-height:320px}.doc-form{grid-template-columns:1fr}.doc-form .full{grid-column:auto}}
  </style>
</head>
<body data-form-id="eures-beta">
  <main class="docs-shell">
    <header class="docs-card docs-head">
      <img class="docs-branding" src="/assets/eures-email-header.png" alt="République Française, France Travail et EURES">
      <div class="docs-head-top">
        <div><h1>Documentation projet</h1><p>Un espace léger pour conserver les décisions, références, réunions et procédures de Match Europe sans alourdir le Kanban.</p></div>
        <nav class="docs-tabs" aria-label="Navigation du projet"><a href="/admin/eures-beta/suivi">Kanban</a><a class="active" href="/admin/eures-beta/documentation">Documentation</a><a href="/admin/eures-beta/">Administration</a><a href="/admin/eures-beta/logout">Se déconnecter</a></nav>
      </div>
    </header>

    <section class="docs-layout">
      <aside class="docs-card docs-sidebar">
        <div class="docs-actions"><strong>Pages</strong><button class="primary" id="new-doc" type="button">Nouvelle page</button></div>
        <label class="docs-filter">Recherche<input id="doc-search" type="search" placeholder="Titre, résumé ou contenu"></label>
        <label class="docs-filter">Catégorie<select id="filter-category"><option value="">Toutes les catégories</option></select></label>
        <label class="docs-filter">État<select id="filter-status"><option value="active">Pages actives</option><option value="draft">Brouillons</option><option value="published">Publiées</option><option value="archived">Archivées</option><option value="all">Toutes</option></select></label>
        <div class="status-line" id="list-status">Chargement...</div>
        <div class="doc-list" id="doc-list"></div>
      </aside>

      <section class="docs-card doc-editor">
        <div class="docs-head-top"><div><strong id="editor-title">Sélectionnez une page</strong><div class="doc-meta" id="editor-meta"></div></div><div class="editor-actions"><button id="preview-toggle" type="button">Aperçu</button><button class="primary" id="save-doc" type="button">Enregistrer</button></div></div>
        <div class="status-line" id="editor-status"></div>
        <form class="doc-form" id="doc-form">
          <label class="full">Titre<input id="doc-title" required maxlength="140" placeholder="Ex. Décision — protocole des introductions"></label>
          <label>Catégorie<select id="doc-category"></select></label>
          <label>État<select id="doc-status"><option value="draft">Brouillon</option><option value="published">Publié</option><option value="archived">Archivé</option></select></label>
          <label>Langue source<select id="doc-language"><option value="fr">Français</option><option value="en">English</option><option value="de">Deutsch</option></select></label>
          <label class="full">Résumé<textarea id="doc-summary" maxlength="600" placeholder="Une synthèse courte pour retrouver rapidement la page."></textarea></label>
          <label class="full">Cartes liées<input id="doc-cards" placeholder="EURES-16, EURES-18"></label>
          <label class="full">Liens externes<textarea id="doc-links" placeholder="Un lien http(s) par ligne"></textarea></label>
          <label class="full">Contenu
            <div class="markdown-tools" role="toolbar" aria-label="Mise en forme du contenu">
              <select id="doc-template" aria-label="Insérer un modèle"><option value="">Modèle…</option><option value="reunion">Compte rendu de réunion</option><option value="decision">Décision</option><option value="procedure">Procédure</option><option value="reference">Référence</option></select>
              <button type="button" data-md="h2" title="Titre de section">Titre</button><button type="button" data-md="bold" title="Gras (⌘B)"><strong>Gras</strong></button><button type="button" data-md="italic" title="Italique (⌘I)"><em>Italique</em></button><button type="button" data-md="bullet" title="Liste à puces">• Liste</button><button type="button" data-md="numbered" title="Liste numérotée">1. Liste</button><button type="button" data-md="check" title="Case à cocher">☐ Tâche</button><button type="button" data-md="quote" title="Citation">❝ Citation</button><button type="button" data-md="link" title="Lien">🔗 Lien</button><button type="button" data-md="code" title="Bloc de code">Code</button><button type="button" data-md="table" title="Tableau simple">Tableau</button><button type="button" data-md="separator" title="Séparateur">—</button>
            </div>
            <div id="doc-content" class="visual-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Documentez ici le contexte, la décision et les suites."></div>
            <span class="markdown-help">La mise en forme apparaît directement pendant la saisie. Raccourcis disponibles : ⌘/Ctrl+B et ⌘/Ctrl+I.</span>
          </label>
        </form>
        <article class="preview hidden" id="doc-preview"></article>
        <section><h2>Historique récent</h2><div class="history" id="doc-history"></div></section>
      </section>
    </section>
  </main>

  <script src="/assets/admin/admin-documentation-1.js"></script>
</body>
</html>
