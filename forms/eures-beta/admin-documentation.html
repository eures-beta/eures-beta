<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EURES beta - Documentation projet</title>
  <link rel="stylesheet" href="/forms/eures-beta/site.css">
  <style>
    body{font-family:Marianne,Arial,sans-serif;font-weight:400}.docs-shell{width:min(1440px,calc(100% - 2rem));margin:0 auto;padding:1rem 0 2rem}.docs-card{border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);border-radius:24px;padding:1.2rem}.docs-head{display:grid;gap:1rem;margin-bottom:1rem}.docs-head-top,.docs-actions,.docs-tabs{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center;justify-content:space-between}.docs-head h1{margin:0;color:var(--accent-strong);font-size:clamp(2rem,4vw,3rem);line-height:1;font-weight:700}.docs-head p{margin:.5rem 0 0;color:var(--muted);max-width:75ch;line-height:1.55}.docs-branding{width:clamp(160px,18vw,260px);height:auto}.docs-tabs{justify-content:flex-start}.docs-tabs a,.docs-actions button,.editor-actions button{min-height:44px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.9);color:var(--text);padding:.7rem 1rem;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}.docs-tabs a.active,.docs-actions button.primary,.editor-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.docs-layout{display:grid;grid-template-columns:minmax(280px,.72fr) minmax(0,1.7fr);gap:1rem}.docs-sidebar{display:grid;gap:1rem;align-content:start}.docs-filter{display:grid;gap:.45rem;font-weight:500}.docs-filter input,.docs-filter select,.doc-form input,.doc-form select,.doc-form textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);padding:.75rem .9rem;font:inherit;font-weight:400}.doc-list{display:grid;gap:.65rem;max-height:70vh;overflow:auto;padding-right:.25rem}.doc-list button{display:grid;gap:.32rem;text-align:left;width:100%;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.78);padding:.85rem;cursor:pointer;color:var(--text);font-weight:400}.doc-list button.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,84,166,.12)}.doc-list strong{font-size:.98rem;font-weight:600}.doc-meta,.status-line{font-size:.82rem;color:var(--muted)}.doc-editor{display:grid;gap:1rem}.doc-editor> .docs-head-top strong{font-weight:600}.doc-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}.doc-form label{display:grid;gap:.35rem;font-size:.88rem;font-weight:500}.doc-form .full{grid-column:1/-1}.doc-form textarea{resize:vertical}.doc-form #doc-summary{min-height:78px}.editor-actions{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center}.markdown-tools{display:flex;flex-wrap:wrap;gap:.35rem;padding:.55rem;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;background:#f5f8fb}.markdown-tools button,.markdown-tools select{min-height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);padding:.45rem .65rem;font:inherit;font-weight:500;cursor:pointer}.markdown-tools button:hover{border-color:var(--accent);color:var(--accent-strong)}.visual-editor{min-height:360px;border:1px solid var(--line);border-radius:0 0 14px 14px;background:#fff;padding:1rem;font:400 1rem/1.65 Marianne,Arial,sans-serif;outline:none;overflow-wrap:anywhere}.visual-editor:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,84,166,.12)}.visual-editor:empty:before{content:attr(data-placeholder);color:var(--muted)}.visual-editor h1,.visual-editor h2,.visual-editor h3{color:var(--accent-strong);line-height:1.2}.visual-editor blockquote{margin-left:0;padding-left:1rem;border-left:4px solid var(--accent);color:var(--muted)}.visual-editor pre{padding:1rem;border-radius:12px;background:#102a43;color:#f5f7fa;white-space:pre-wrap}.visual-editor table{width:100%;border-collapse:collapse}.visual-editor th,.visual-editor td{border:1px solid var(--line);padding:.5rem}.markdown-help{margin:0;font-size:.8rem;font-weight:400;color:var(--muted)}.preview{border:1px solid var(--line);border-radius:18px;background:#fff;padding:1.25rem;min-height:240px;line-height:1.7;overflow-wrap:anywhere}.preview h1,.preview h2,.preview h3{color:var(--accent-strong);line-height:1.2}.preview pre{overflow:auto;padding:1rem;border-radius:12px;background:#102a43;color:#f5f7fa}.preview code{padding:.15rem .35rem;border-radius:5px;background:#eef3f7}.preview pre code{padding:0;background:transparent}.preview blockquote{margin-left:0;padding-left:1rem;border-left:4px solid var(--accent);color:var(--muted)}.preview table{width:100%;border-collapse:collapse}.preview th,.preview td{border:1px solid var(--line);padding:.5rem;text-align:left}.history{display:grid;gap:.55rem}.history article{border-left:3px solid var(--line);padding-left:.75rem}.history p{margin:.15rem 0;color:var(--muted);font-size:.86rem}.empty{padding:1rem;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.hidden{display:none!important}@media(max-width:900px){.docs-layout{grid-template-columns:1fr}.doc-list{max-height:320px}.doc-form{grid-template-columns:1fr}.doc-form .full{grid-column:auto}}
  </style>
</head>
<body data-form-id="eures-beta">
  <main class="docs-shell">
    <header class="docs-card docs-head">
      <img class="docs-branding" src="/assets/eures-email-header.png" alt="République Française, France Travail et EURES">
      <div class="docs-head-top">
        <div><h1>Documentation projet</h1><p>Un espace léger pour conserver les décisions, références, réunions et procédures de Match Europe sans alourdir le Kanban.</p></div>
        <nav class="docs-tabs" aria-label="Navigation du projet"><a href="/admin/eures-beta/suivi">Kanban</a><a class="active" href="/admin/eures-beta/documentation">Documentation</a><a href="/admin/eures-beta/">Administration</a><a href="/admin/eures-beta/logout">Se déconnecter</a></nav>
      </div>
    </header>

    <section class="docs-layout">
      <aside class="docs-card docs-sidebar">
        <div class="docs-actions"><strong>Pages</strong><button class="primary" id="new-doc" type="button">Nouvelle page</button></div>
        <label class="docs-filter">Recherche<input id="doc-search" type="search" placeholder="Titre, résumé ou contenu"></label>
        <label class="docs-filter">Catégorie<select id="filter-category"><option value="">Toutes les catégories</option></select></label>
        <label class="docs-filter">État<select id="filter-status"><option value="active">Pages actives</option><option value="draft">Brouillons</option><option value="published">Publiées</option><option value="archived">Archivées</option><option value="all">Toutes</option></select></label>
        <div class="status-line" id="list-status">Chargement...</div>
        <div class="doc-list" id="doc-list"></div>
      </aside>

      <section class="docs-card doc-editor">
        <div class="docs-head-top"><div><strong id="editor-title">Sélectionnez une page</strong><div class="doc-meta" id="editor-meta"></div></div><div class="editor-actions"><button id="preview-toggle" type="button">Aperçu</button><button class="primary" id="save-doc" type="button">Enregistrer</button></div></div>
        <div class="status-line" id="editor-status"></div>
        <form class="doc-form" id="doc-form">
          <label class="full">Titre<input id="doc-title" required maxlength="140" placeholder="Ex. Décision — protocole des introductions"></label>
          <label>Catégorie<select id="doc-category"></select></label>
          <label>État<select id="doc-status"><option value="draft">Brouillon</option><option value="published">Publié</option><option value="archived">Archivé</option></select></label>
          <label>Langue source<select id="doc-language"><option value="fr">Français</option><option value="en">English</option><option value="de">Deutsch</option></select></label>
          <label class="full">Résumé<textarea id="doc-summary" maxlength="600" placeholder="Une synthèse courte pour retrouver rapidement la page."></textarea></label>
          <label class="full">Cartes liées<input id="doc-cards" placeholder="EURES-16, EURES-18"></label>
          <label class="full">Liens externes<textarea id="doc-links" placeholder="Un lien http(s) par ligne"></textarea></label>
          <label class="full">Contenu
            <div class="markdown-tools" role="toolbar" aria-label="Mise en forme du contenu">
              <select id="doc-template" aria-label="Insérer un modèle"><option value="">Modèle…</option><option value="reunion">Compte rendu de réunion</option><option value="decision">Décision</option><option value="procedure">Procédure</option><option value="reference">Référence</option></select>
              <button type="button" data-md="h2" title="Titre de section">Titre</button><button type="button" data-md="bold" title="Gras (⌘B)"><strong>Gras</strong></button><button type="button" data-md="italic" title="Italique (⌘I)"><em>Italique</em></button><button type="button" data-md="bullet" title="Liste à puces">• Liste</button><button type="button" data-md="numbered" title="Liste numérotée">1. Liste</button><button type="button" data-md="check" title="Case à cocher">☐ Tâche</button><button type="button" data-md="quote" title="Citation">❝ Citation</button><button type="button" data-md="link" title="Lien">🔗 Lien</button><button type="button" data-md="code" title="Bloc de code">Code</button><button type="button" data-md="table" title="Tableau simple">Tableau</button><button type="button" data-md="separator" title="Séparateur">—</button>
            </div>
            <div id="doc-content" class="visual-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Documentez ici le contexte, la décision et les suites."></div>
            <span class="markdown-help">La mise en forme apparaît directement pendant la saisie. Raccourcis disponibles : ⌘/Ctrl+B et ⌘/Ctrl+I.</span>
          </label>
        </form>
        <article class="preview hidden" id="doc-preview"></article>
        <section><h2>Historique récent</h2><div class="history" id="doc-history"></div></section>
      </section>
    </section>
  </main>

  <script>
    const FORM_ID=document.body.dataset.formId||"eures-beta";
    const categories={vision:"Vision et stratégie",produit_metier:"Produit et métier",technique:"Technique",decisions:"Décisions",reunions:"Réunions",procedures:"Procédures",ressources:"Ressources"};
    const linkedCard=new URLSearchParams(window.location.search).get("card")?.toUpperCase()||"";
    const state={documents:[],current:null,showPreview:false,saving:false};
    const templates={
      reunion:"# Compte rendu de réunion\n\n**Date :** \n**Participants :** \n\n## Objectif\n\n\n## Points abordés\n\n- \n\n## Décisions\n\n- \n\n## Actions\n\n- [ ] Action — responsable — échéance\n",
      decision:"# Décision\n\n## Contexte\n\n\n## Décision prise\n\n\n## Raisons\n\n- \n\n## Conséquences et actions\n\n- [ ] \n",
      procedure:"# Procédure\n\n## Objectif\n\n\n## Prérequis\n\n- \n\n## Étapes\n\n1. \n2. \n3. \n\n## Points de contrôle\n\n- [ ] \n",
      reference:"# Référence\n\n## Objet\n\n\n## Informations essentielles\n\n- \n\n## Liens et documents associés\n\n- [Intitulé](https://)\n"
    };
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
    const normalize=value=>String(value||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const api=path=>`/api/forms/${FORM_ID}${path}`;
    async function fetchJson(url,options={}){const response=await fetch(url,{...options,headers:{"X-UI-Language":"fr",...(options.headers||{})}});const payload=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(payload.error||`Erreur HTTP ${response.status}`);error.status=response.status;error.payload=payload;throw error}return payload}
    function defaultDocument(){return{titre:"",resume:"",contenu_markdown:"",categorie:"produit_metier",statut:"draft",langue_source:"fr",cartes_liees:linkedCard?[linkedCard]:[],liens:[],historique:[],updated_at:""}}
    function formatDate(value){if(!value)return"";try{return new Intl.DateTimeFormat("fr-FR",{dateStyle:"medium",timeStyle:"short",timeZone:"Europe/Paris"}).format(new Date(value))}catch{return value}}
    function fillCategoryOptions(){const options=Object.entries(categories).map(([value,label])=>`<option value="${value}">${esc(label)}</option>`).join("");$("doc-category").innerHTML=options;$("filter-category").insertAdjacentHTML("beforeend",options)}
    function filteredDocuments(){const query=normalize($("doc-search").value);const category=$("filter-category").value;const status=$("filter-status").value;return state.documents.filter(doc=>{if(linkedCard&&!(doc.cartes_liees||[]).includes(linkedCard))return false;if(category&&doc.categorie!==category)return false;if(status==="active"&&doc.statut==="archived")return false;if(!["active","all"].includes(status)&&doc.statut!==status)return false;if(query&&!normalize([doc.titre,doc.resume,doc.contenu_markdown,doc.auteur,(doc.cartes_liees||[]).join(" ")].join(" ")).includes(query))return false;return true})}
    function renderList(){const docs=filteredDocuments();const scope=linkedCard?` liée(s) à ${linkedCard}`:" affichée(s)";$("list-status").textContent=`${docs.length} page(s)${scope} sur ${state.documents.length}.`;$("doc-list").innerHTML=docs.length?docs.map(doc=>`<button type="button" data-record-id="${doc.record_id}" class="${state.current?.record_id===doc.record_id?"active":""}"><strong>${esc(doc.titre||"Sans titre")}</strong><span class="doc-meta">${esc(categories[doc.categorie]||doc.categorie)} · ${doc.statut==="published"?"Publié":doc.statut==="archived"?"Archivé":"Brouillon"}</span><span class="doc-meta">${esc(doc.auteur||"Auteur non défini")} · ${esc(formatDate(doc.updated_at))}</span></button>`).join(""):`<div class="empty">Aucune page ne correspond aux filtres.</div>`;$("doc-list").querySelectorAll("[data-record-id]").forEach(button=>button.addEventListener("click",()=>openDocument(Number(button.dataset.recordId))))}
    function inlineMarkdown(value){let text=esc(value);text=text.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");text=text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>`<a href="${esc(url)}" target="_blank" rel="noreferrer">${label}</a>`);return text}
    function renderMarkdown(markdown){const lines=String(markdown||"").split("\n");let html="",listType="",inCode=false,code=[];const closeList=()=>{if(listType){html+=`</${listType}>`;listType=""}};for(const line of lines){if(line.trim().startsWith("```")){closeList();if(inCode){html+=`<pre><code>${esc(code.join("\n"))}</code></pre>`;code=[];inCode=false}else inCode=true;continue}if(inCode){code.push(line);continue}if(/^###\s+/.test(line)){closeList();html+=`<h3>${inlineMarkdown(line.replace(/^###\s+/,""))}</h3>`}else if(/^##\s+/.test(line)){closeList();html+=`<h2>${inlineMarkdown(line.replace(/^##\s+/,""))}</h2>`}else if(/^#\s+/.test(line)){closeList();html+=`<h1>${inlineMarkdown(line.replace(/^#\s+/,""))}</h1>`}else if(/^[-*]\s+\[[ xX]\]\s+/.test(line)){if(listType!=="ul"){closeList();html+="<ul>";listType="ul"}const checked=/^[-*]\s+\[[xX]\]/.test(line);html+=`<li><input type="checkbox" disabled ${checked?"checked":""}> ${inlineMarkdown(line.replace(/^[-*]\s+\[[ xX]\]\s+/,""))}</li>`}else if(/^[-*]\s+/.test(line)){if(listType!=="ul"){closeList();html+="<ul>";listType="ul"}html+=`<li>${inlineMarkdown(line.replace(/^[-*]\s+/,""))}</li>`}else if(/^\d+\.\s+/.test(line)){if(listType!=="ol"){closeList();html+="<ol>";listType="ol"}html+=`<li>${inlineMarkdown(line.replace(/^\d+\.\s+/,""))}</li>`}else if(/^>\s?/.test(line)){closeList();html+=`<blockquote>${inlineMarkdown(line.replace(/^>\s?/,""))}</blockquote>`}else if(/^---+$/.test(line.trim())){closeList();html+="<hr>"}else if(/^\|.*\|$/.test(line)&&!/^\|[\s:|-]+\|$/.test(line)){closeList();const cells=line.slice(1,-1).split("|").map(cell=>`<td>${inlineMarkdown(cell.trim())}</td>`).join("");html+=`<table><tbody><tr>${cells}</tr></tbody></table>`}else if(!line.trim()){closeList()}else{closeList();html+=`<p>${inlineMarkdown(line)}</p>`}}closeList();if(inCode)html+=`<pre><code>${esc(code.join("\n"))}</code></pre>`;return html||"<p class='doc-meta'>L’aperçu apparaîtra ici.</p>"}
    function editorToMarkdown(){const editor=$("doc-content");const convert=node=>{if(node.nodeType===Node.TEXT_NODE)return node.textContent;if(node.nodeType!==Node.ELEMENT_NODE)return"";const tag=node.tagName.toLowerCase();const children=()=>Array.from(node.childNodes).map(convert).join("");if(tag==="br")return"\n";if(tag==="strong"||tag==="b")return`**${children()}**`;if(tag==="em"||tag==="i")return`*${children()}*`;if(tag==="a")return`[${children()}](${node.getAttribute("href")||""})`;if(tag==="h1")return`# ${children()}\n\n`;if(tag==="h2")return`## ${children()}\n\n`;if(tag==="h3")return`### ${children()}\n\n`;if(tag==="p"||tag==="div")return`${children()}\n\n`;if(tag==="blockquote")return`${children().split("\n").filter(Boolean).map(line=>`> ${line}`).join("\n")}\n\n`;if(tag==="pre")return`\`\`\`\n${node.textContent}\n\`\`\`\n\n`;if(tag==="hr")return"---\n\n";if(tag==="ul"||tag==="ol")return`${Array.from(node.children).map((item,index)=>`${tag==="ol"?`${index+1}.`:"-"} ${convert(item).trim()}`).join("\n")}\n\n`;if(tag==="li")return children();if(tag==="table")return`${Array.from(node.rows).map(row=>`| ${Array.from(row.cells).map(cell=>cell.textContent.trim()).join(" | ")} |`).join("\n")}\n\n`;return children()};const blocks=new Set(["div","p","h1","h2","h3","blockquote","pre","ul","ol","table","hr"]);let markdown="";for(const node of editor.childNodes){const isBlock=node.nodeType===Node.ELEMENT_NODE&&blocks.has(node.tagName.toLowerCase());if(isBlock&&markdown&&!markdown.endsWith("\n"))markdown+="\n";markdown+=convert(node)}return markdown.replace(/\n{3,}/g,"\n\n").trim()}
    function insertVisual(action){const editor=$("doc-content");editor.focus();if(action==="bold")document.execCommand("bold");else if(action==="italic")document.execCommand("italic");else if(action==="h2")document.execCommand("formatBlock",false,"h2");else if(action==="bullet")document.execCommand("insertUnorderedList");else if(action==="numbered")document.execCommand("insertOrderedList");else if(action==="quote")document.execCommand("formatBlock",false,"blockquote");else if(action==="code")document.execCommand("formatBlock",false,"pre");else if(action==="separator")document.execCommand("insertHorizontalRule");else if(action==="check")document.execCommand("insertHTML",false,"<div>☐ Tâche à réaliser</div>");else if(action==="table")document.execCommand("insertHTML",false,'<table><tbody><tr><th>Colonne 1</th><th>Colonne 2</th></tr><tr><td>Valeur 1</td><td>Valeur 2</td></tr></tbody></table><p><br></p>');else if(action==="link"){const selection=window.getSelection()?.toString()||"intitulé du lien";const url=window.prompt("Adresse du lien (https://…)","https://");if(url&&/^https?:\/\//i.test(url))document.execCommand("insertHTML",false,`<a href="${esc(url)}">${esc(selection)}</a>`)}editor.dispatchEvent(new Event("input"))}
    function applyTemplate(name){if(!templates[name])return;const field=$("doc-content");if(field.textContent.trim()&&!window.confirm("Remplacer le contenu actuel par ce modèle ?"))return;field.innerHTML=renderMarkdown(templates[name]);field.focus();$("doc-template").value=""}
    function readForm(){const base=state.current||defaultDocument();return{...base,titre:$("doc-title").value.trim(),resume:$("doc-summary").value.trim(),contenu_markdown:editorToMarkdown(),categorie:$("doc-category").value,statut:$("doc-status").value,langue_source:$("doc-language").value,cartes_liees:$("doc-cards").value.split(/[\n,]/).map(x=>x.trim()).filter(Boolean),liens:$("doc-links").value.split("\n").map(x=>x.trim()).filter(Boolean),expected_updated_at:base.updated_at||""}}
    function renderEditor(){const doc=state.current;if(!doc){$("doc-form").classList.add("hidden");$("save-doc").disabled=true;$("preview-toggle").disabled=true;$("editor-title").textContent="Sélectionnez une page";$("editor-meta").textContent="";$("doc-preview").classList.add("hidden");$("doc-history").innerHTML='<div class="empty">Aucun historique à afficher.</div>';return}$("doc-form").classList.toggle("hidden",state.showPreview);$("doc-preview").classList.toggle("hidden",!state.showPreview);$("save-doc").disabled=false;$("preview-toggle").disabled=false;$("preview-toggle").textContent=state.showPreview?"Modifier":"Lecture";$("editor-title").textContent=doc.titre||"Nouvelle page";$("editor-meta").textContent=doc.record_id?`Dernière modification : ${formatDate(doc.updated_at)} par ${doc.auteur||"admin"}`:"Page non enregistrée";$("doc-title").value=doc.titre||"";$("doc-summary").value=doc.resume||"";$("doc-content").innerHTML=doc.contenu_markdown?renderMarkdown(doc.contenu_markdown):"";$("doc-category").value=doc.categorie||"produit_metier";$("doc-status").value=doc.statut||"draft";$("doc-language").value=doc.langue_source||"fr";$("doc-cards").value=(doc.cartes_liees||[]).join(", ");$("doc-links").value=(doc.liens||[]).join("\n");$("doc-preview").innerHTML=renderMarkdown(doc.contenu_markdown);const history=Array.isArray(doc.historique)?doc.historique:[];$("doc-history").innerHTML=history.length?history.slice().reverse().map(item=>`<article><strong>Version du ${esc(formatDate(item.at))}</strong><p>${esc(item.actor||"admin")} · ${esc(item.titre||"Sans titre")}</p></article>`).join(""):'<div class="empty">Aucune version antérieure.</div>'}
    function openDocument(recordId){const doc=state.documents.find(item=>Number(item.record_id)===Number(recordId));state.current=doc?structuredClone(doc):null;state.showPreview=false;$("editor-status").textContent="";renderList();renderEditor()}
    async function loadDocuments(selectRecordId=null){const payload=await fetchJson(api("/admin/documentation/documents"));state.documents=Array.isArray(payload.documents)?payload.documents:[];renderList();if(selectRecordId)openDocument(selectRecordId);else if(state.current?.record_id){const fresh=state.documents.find(item=>item.record_id===state.current.record_id);state.current=fresh?structuredClone(fresh):null;renderEditor()}}
    async function saveDocument(){if(state.saving||!state.current)return;state.saving=true;$("save-doc").disabled=true;$("editor-status").textContent="Enregistrement en cours...";const payload=readForm();const recordId=state.current.record_id;try{const result=await fetchJson(recordId?api(`/admin/documentation/documents/${recordId}`):api("/admin/documentation/documents"),{method:recordId?"PATCH":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});$("editor-status").textContent=(result.warnings||[]).join(" ")||"Page enregistrée.";await loadDocuments(result.document.record_id)}catch(error){if(error.status===409){$("editor-status").textContent=error.message;await loadDocuments(recordId)}else $("editor-status").textContent=error.message||"Enregistrement impossible."}finally{state.saving=false;$("save-doc").disabled=!state.current}}
    fillCategoryOptions();
    $("new-doc").addEventListener("click",()=>{state.current=defaultDocument();state.showPreview=false;$("editor-status").textContent="";renderList();renderEditor();$("doc-title").focus()});
    $("save-doc").addEventListener("click",saveDocument);
    $("preview-toggle").addEventListener("click",()=>{if(!state.current)return;state.current=readForm();state.showPreview=!state.showPreview;renderEditor()});
    document.querySelectorAll("[data-md]").forEach(button=>{button.addEventListener("mousedown",event=>event.preventDefault());button.addEventListener("click",()=>insertVisual(button.dataset.md))});
    $("doc-template").addEventListener("change",event=>applyTemplate(event.target.value));
    $("doc-content").addEventListener("keydown",event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="b"){event.preventDefault();insertVisual("bold")}else if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="i"){event.preventDefault();insertVisual("italic")}});
    for(const id of ["doc-search","filter-category","filter-status"]){$(id).addEventListener(id==="doc-search"?"input":"change",renderList)}
    loadDocuments().catch(error=>{$("list-status").textContent=error.message||"Chargement impossible."});
  </script>
</body>
</html>
