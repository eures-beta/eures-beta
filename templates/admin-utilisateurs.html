<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utilisateurs et droits — Match Europe</title><link rel="stylesheet" href="/forms/eures-beta/site.css">
<style>
main{max-width:1200px;margin:2rem auto;padding:0 1rem}header,.panel{background:var(--panel,#fff);border:1px solid var(--line,#ddd);border-radius:24px;padding:1.5rem;margin-bottom:1rem}h1{margin:.5rem 0;font-size:clamp(2rem,5vw,3rem)}.actions,.tabs,.form-actions{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;padding:.7rem;border:1px solid #8a9baa;border-radius:9px}button{cursor:pointer;background:#fff;color:#173e60}.primary{background:#004494;color:#fff;border-color:#004494}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #076bd0;outline-offset:3px}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:.8rem;border-bottom:1px solid #ddd}.muted{color:#526675}.badge{display:inline-block;padding:.25rem .55rem;border-radius:999px;background:#e9eef2}.inactive{background:#f3dddd;color:#742626}.hidden{display:none!important}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.form-grid label{display:grid;gap:.35rem}.full{grid-column:1/-1}dialog{border:1px solid #ccc;border-radius:20px;width:min(760px,calc(100% - 2rem));max-height:90vh;padding:1.5rem}dialog::backdrop{background:#132c4266}.permissions{display:flex;gap:.4rem;flex-wrap:wrap}.permission{font-family:ui-monospace,monospace;background:#eef3f7;padding:.25rem .5rem;border-radius:6px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}header,.panel{padding:1rem}}
</style></head><body><main>
<header><a href="/admin/eures-beta/">← Administration Match Europe</a><h1>Utilisateurs &amp; droits</h1><p>Comptes personnels, rôles et accès à Match Europe.</p><p class="muted">Les rôles et leurs permissions sont consultables uniquement dans cette version.</p></header>
<section class="panel"><div class="tabs"><button id="users-tab" class="primary" type="button">Utilisateurs</button><button id="roles-tab" type="button">Rôles &amp; permissions</button></div></section>
<section id="users-panel" class="panel"><div class="actions"><h2>Utilisateurs</h2><button id="add" class="primary" type="button">Ajouter un utilisateur</button></div><p id="users-status" role="status">Chargement…</p><div class="table-scroll"><table><thead><tr><th>Nom</th><th>Institution</th><th>Pays</th><th>Rôle</th><th>Statut</th><th></th></tr></thead><tbody id="users"></tbody></table></div></section>
<section id="roles-panel" class="panel hidden"><h2>Rôles &amp; permissions</h2><p id="roles-status" role="status">Chargement…</p><div id="roles"></div></section>
<dialog id="editor" aria-labelledby="editor-title"><form id="form"><h2 id="editor-title">Fiche utilisateur</h2><input id="record-id" type="hidden"><input id="version" type="hidden"><div class="form-grid">
<label>Nom<input id="Nom" required maxlength="200" autocomplete="name"></label><label>Fonction<input id="Fonction" maxlength="300" autocomplete="organization-title"></label><label>Email<input id="Email" required maxlength="320" type="email" autocomplete="email"></label><label>Téléphone<input id="Telephone" maxlength="100" type="text" inputmode="tel" autocomplete="tel" placeholder="+33… ou 0033…"></label><label>Institution<input id="Institution" maxlength="300" autocomplete="organization"></label><label>Pays<input id="Pays" maxlength="150" autocomplete="country-name"></label><label>Rôle<select id="Role" required></select></label><label>Statut<select id="Actif"><option value="true">Actif</option><option value="false">Inactif</option></select></label>
</div><p id="form-status" role="status"></p><div class="form-actions"><button class="primary" type="submit">Enregistrer</button><button id="cancel" type="button">Annuler</button></div></form></dialog>
</main><script>
const base="/api/forms/eures-beta/admin",$=id=>document.getElementById(id);let csrf="",users=[],roles=[];
const labels={csrf_failed:"La session de sécurité a expiré. Rechargez la page.",email_already_exists:"Cette adresse email est déjà utilisée.",stale_record:"Cette fiche a été modifiée. Rechargez-la avant de réessayer.",self_deactivation_forbidden:"Vous ne pouvez pas désactiver votre propre compte.",last_active_admin:"Le dernier administrateur actif ne peut pas perdre son accès.",unknown_role:"Ce rôle n’existe plus.",required:"Un champ obligatoire est manquant.",invalid_email:"L’adresse email n’est pas valide.",administration_unavailable:"Le service d’habilitations est indisponible.","Authorization unavailable":"Le service d’autorisation est indisponible."};
async function request(url,options={}){const headers={...(options.headers||{})};if(options.body){headers["Content-Type"]="application/json";headers["X-CSRF-Token"]=csrf;}const response=await fetch(url,{credentials:"same-origin",cache:"no-store",redirect:"error",...options,headers});let data={};try{data=await response.json();}catch{}if(response.status===401)throw Error("Session expirée. Reconnectez-vous.");if(response.status===403&&data.error!=="csrf_failed")throw Error("Votre compte ne dispose pas de la permission admin.users.");if(!response.ok)throw Error(labels[data.error]||data.error||"Service indisponible.");return data;}
function roleName(code){return roles.find(r=>r.code===code)?.nom||code||"Non renseigné"}function text(value){return value===null||value===undefined||value===""?"Non renseigné":String(value)}
function renderUsers(){$("users").replaceChildren();for(const user of users){const row=document.createElement("tr");for(const value of [user.Nom,user.Institution,user.Pays,roleName(user.Role)]){const td=document.createElement("td");td.textContent=text(value);row.append(td);}const status=document.createElement("td"),badge=document.createElement("span");badge.className="badge"+(user.Actif?"":" inactive");badge.textContent=user.Actif?"Actif":"Inactif";status.append(badge);row.append(status);const action=document.createElement("td"),button=document.createElement("button");button.type="button";button.textContent="Ouvrir la fiche";button.onclick=()=>openEditor(user);action.append(button);row.append(action);$("users").append(row);}$("users-status").textContent=users.length?`${users.length} utilisateur(s)`:"Aucun utilisateur.";}
function renderRoles(){const root=$("roles");root.replaceChildren();for(const role of roles){const section=document.createElement("section"),title=document.createElement("h3"),list=document.createElement("div");title.textContent=role.nom;list.className="permissions";for(const value of role.permissions){const item=document.createElement("span");item.className="permission";item.textContent=value;list.append(item);}section.append(title,list);root.append(section);}$("roles-status").textContent=roles.length?`${roles.length} rôle(s), lecture seule.`:"Aucun rôle disponible.";}
function fillRoleOptions(value=""){const select=$("Role");select.replaceChildren();for(const role of roles){const option=document.createElement("option");option.value=role.code;option.textContent=role.nom;select.append(option);}select.value=value||roles[0]?.code||"";}
function openEditor(user=null){$("form").reset();$("form-status").textContent="";$("record-id").value=user?.record_id??"";$("version").value=user?.Version_session??"";for(const field of ["Nom","Fonction","Email","Telephone","Institution","Pays"])$(field).value=user?.[field]??"";fillRoleOptions(user?.Role);$("Actif").value=String(user?.Actif??true);$("Actif").disabled=!user;$("editor-title").textContent=user?"Fiche utilisateur":"Ajouter un utilisateur";$("editor").showModal();}
async function load(){try{const access=await request(`${base}/utilisateurs/access`);csrf=access.csrf_token;[users,roles]=await Promise.all([request(`${base}/utilisateurs`).then(x=>x.users),request(`${base}/roles`).then(x=>x.roles)]);renderUsers();renderRoles();}catch(error){$("users-status").textContent=error.message;$("roles-status").textContent=error.message;}}
$("form").onsubmit=async event=>{event.preventDefault();const id=$("record-id").value;const payload={};for(const field of ["Nom","Fonction","Email","Telephone","Institution","Pays","Role"])payload[field]=$(field).value;if(id){payload.Actif=$("Actif").value==="true";payload.expected_version=Number($("version").value);}$("form-status").textContent="Enregistrement…";try{await request(id?`${base}/utilisateurs/${id}`:`${base}/utilisateurs`,{method:id?"PATCH":"POST",body:JSON.stringify(payload)});$("editor").close();await load();}catch(error){$("form-status").textContent=error.message;}};
$("add").onclick=()=>openEditor();$("cancel").onclick=()=>$("editor").close();$("users-tab").onclick=()=>{$("users-panel").classList.remove("hidden");$("roles-panel").classList.add("hidden");$("users-tab").classList.add("primary");$("roles-tab").classList.remove("primary");};$("roles-tab").onclick=()=>{$("roles-panel").classList.remove("hidden");$("users-panel").classList.add("hidden");$("roles-tab").classList.add("primary");$("users-tab").classList.remove("primary");};window.addEventListener("pageshow",event=>{if(event.persisted)location.reload();});load();
</script></body></html>
